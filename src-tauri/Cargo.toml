[package]
name = "kk-studio"
version = "2.1.44"
description = "kk Studio - AI 创作工作台"
authors = ["kk Studio"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "socks"] }
hyper-util = { version = "0.1", features = ["client-proxy-system"] }
futures-util = "0.3"
dirs = "5"
dunce = "1.0.5"
anyhow = "1"
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
ryu-js = "1.0.3"
getrandom = "=0.3.4"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = ["Foundation", "Networking_Connectivity"] }
windows-future = "0.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
