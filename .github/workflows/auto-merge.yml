name: controlled-auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Thread resolution is a webhook event, not an Actions trigger. Resolution-only
# changes are re-evaluated on the next supported PR/review/comment event.

# The workflow is deliberately inert until the repository variable
# AUTO_MERGE_ACTIVATION=enabled is read back by the script. No local default
# enables a merge. The control plane checks out the trusted base SHA so PR
# changes are never executed by this control plane.
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  enable:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Evaluate readback gates and enable native auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/governance/merge-auto.mjs
