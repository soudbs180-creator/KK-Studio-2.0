name: git-guards

on:
  push:
    branches: [main, "fix/**", "codex/**", "test/**", "chore/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  hook-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - name: Exercise real Git hooks and reviewed v1 upgrade
        run: node --test tests/unit/gitPushPolicy.test.ts tests/unit/gitPushGuardPaths.test.ts
