name: native-crossplatform

on:
  push:
    branches: [codex/TASK-CHERRY-RED-001]
    paths:
      - "src-tauri/**"
      - "scripts/agent/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-crossplatform.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/agent/**"
      - "tests/unit/agentPackage.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-crossplatform.yml"

permissions:
  contents: read

concurrency:
  group: native-crossplatform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config xvfb dbus-x11 gnome-keyring
      - name: Install existing locked application dependencies
        run: npm ci
      - name: Verify platform-bound Agent packaging fixtures
        run: node --test tests/unit/agentPackage.test.ts
      - name: Build frontend assets needed by Tauri
        run: npm run build
      - name: Check native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run native tests including Unix guardian ownership and parent SIGKILL
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Check the native host
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the platform-bound desktop with Agent resources
        run: npm run client:build:agent -- --no-bundle
      - name: Build the isolated Windows installer candidate
        if: runner.os == 'Windows'
        run: npm run client:installer
      - name: Verify and exercise the Windows installer without a user's existing application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git status --short
          # Tauri emits platform ACL documentation. These files are excluded
          # from release inputs; preserve the build diff before restoring only
          # these generated documents. All source dirt still blocks the receipt.
          New-Item -ItemType Directory -Path .tmp/native-installer -Force | Out-Null
          git diff -- src-tauri/gen/schemas > .tmp/native-installer/generated-acl.diff
          git restore -- src-tauri/gen/schemas/acl-manifests.json src-tauri/gen/schemas/capabilities.json src-tauri/gen/schemas/desktop-schema.json src-tauri/gen/schemas/windows-schema.json
          $taskDesktopVersion = (Get-Content config/platform-versions.json -Raw | ConvertFrom-Json).desktop
          $taskInstaller = Join-Path $PWD "src-tauri/target/release/bundle/nsis/KK Studio_$($taskDesktopVersion)_x64-setup.exe"
          $taskRelease = Join-Path $PWD ".tmp/native-installer/release"
          npm run client:installer:receipt -- "$taskInstaller" "$taskRelease"
          if ($LASTEXITCODE -ne 0) { throw "Installer receipt failed" }
          npm run client:installer:verify -- "$taskRelease/installer-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "Installer verification failed" }
          $env:KK_DESKTOP_AUDIT_OUTPUT = Join-Path $PWD ".tmp/native-installer/evidence"
          npm run client:installer:test -- "$taskRelease/installer-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "Installer runtime failed" }
          Get-Content "$env:KK_DESKTOP_AUDIT_OUTPUT/runtime.json" -Raw
      - name: Build an explicitly enabled test driver in a separate target directory
        run: cargo build --release --features native-e2e --locked --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target/native-e2e
      - name: Exercise actual Native UI, local HTTP, system vault, package and bundled Agent
        if: runner.os != 'Linux'
        shell: bash
        run: |
          executable=src-tauri/target/native-e2e/release/kk-studio
          if [[ "$RUNNER_OS" == Windows ]]; then executable="$executable.exe"; fi
          node tests/desktop/native-crossplatform.mjs "$executable"
      - name: Exercise Linux Native UI with a real isolated Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "synthetic-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node tests/desktop/native-crossplatform.mjs src-tauri/target/native-e2e/release/kk-studio
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}-evidence
          path: |
            .tmp/native-e2e/
            .tmp/native-installer/
          if-no-files-found: ignore
