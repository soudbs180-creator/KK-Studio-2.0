name: quality

on:
  push:
    branches: [main, master, 'codex/**', 'chore/**', 'fix/**', 'feat/**', 'docs/**', 'test/**', 'perf/**', 'refactor/**', 'hotfix/**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install msedge
      - run: npm run verify
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: npm run client:check
      - run: npm run client:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/evidence/browser-results.json
            test-results/
          if-no-files-found: ignore
