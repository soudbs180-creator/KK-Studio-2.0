name: quality

on:
  push:
    branches:
      [
        main,
        master,
        "codex/**",
        "chore/**",
        "fix/**",
        "feat/**",
        "docs/**",
        "test/**",
        "perf/**",
        "refactor/**",
        "hotfix/**",
      ]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  deploy-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - run: node --test tests/deploy/*.test.mjs
  delivery:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - name: Validate current change package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node scripts/check-delivery.mjs --base "$env:BASE_SHA" --head "$env:HEAD_SHA"
  governance:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run governance:check
      - name: Enforce memory contract synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/governance/check-policy-sync.mjs --base "$BASE_SHA"
      - name: Revalidate merge-group base, head, and ancestry
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: node scripts/governance/merge-group-gate.mjs
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run version:consistency
      - run: node node_modules/@playwright/test/cli.js install msedge
      - name: Run repository verification
        env:
          GOVERNANCE_BASE: origin/main
        run: npm run verify
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: npm run client:check
      - run: npm run client:build -- --no-bundle
      - name: Ensure the native WebView2 Runtime is installed
        shell: pwsh
        run: |
          ./tests/desktop/webview2-prerequisite.ps1
          ./.github/scripts/ensure-webview2.ps1
      - name: Verify native TaskHost lifecycle with isolated local fixtures
        shell: pwsh
        run: |
          ./tests/desktop/native-ci-policy.ps1
          ./.github/scripts/invoke-native-taskhost.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/evidence/browser-results.json
            test-results/
          if-no-files-found: ignore
